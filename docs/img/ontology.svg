<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
  </defs>
  <rect width="960" height="680" rx="16" fill="#ffffff"/>
  <text x="30" y="44" font-size="22" font-weight="700" fill="#1f2328">온톨로지 — 파일 사이의 관계를 적어 두고, 코드가 검사한다</text>
  <text x="30" y="68" font-size="13.5" fill="#59636e">폴더 경로만으로는 "이 서류들이 한 거래의 증빙 세트"라는 사실이 남지 않는다. 관계를 따로 적어 두면 빠진 서류를 사람이 아니라 코드가 찾는다.</text>

  <!-- A. 개체와 관계 -->
  <text x="30" y="108" font-size="15" font-weight="700" fill="#0969da">① 무엇을 적나 — 개체 5종과 파일, 관계 5개 (더 늘리지 않는다)</text>
  <rect x="30" y="120" width="440" height="270" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-size="14" text-anchor="middle">
    <rect x="60" y="140" width="150" height="50" rx="8" fill="#ffffff" stroke="#d0d7de"/><text x="135" y="161" font-weight="700" fill="#1f2328">거래처</text><text x="135" y="180" font-size="11.5" fill="#59636e">예: 거래처B</text>
    <rect x="290" y="140" width="150" height="50" rx="8" fill="#ffffff" stroke="#d0d7de"/><text x="365" y="161" font-weight="700" fill="#1f2328">저장위치</text><text x="365" y="180" font-size="11.5" fill="#59636e">어느 클라우드·폴더</text>
    <rect x="60" y="230" width="150" height="50" rx="8" fill="#ffffff" stroke="#d0d7de"/><text x="135" y="251" font-weight="700" fill="#1f2328">프로젝트</text><text x="135" y="270" font-size="11.5" fill="#59636e">예: 2025_사업A</text>
    <rect x="290" y="230" width="150" height="50" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="365" y="251" font-weight="700" fill="#0969da">문서세트 ★</text><text x="365" y="270" font-size="11.5" fill="#0969da">거래 하나 = 폴더 하나</text>
    <rect x="60" y="320" width="150" height="50" rx="8" fill="#ffffff" stroke="#d0d7de"/><text x="135" y="341" font-weight="700" fill="#1f2328">의무·기한</text><text x="135" y="360" font-size="11.5" fill="#59636e">제출할 것·마감·담당</text>
    <rect x="290" y="320" width="150" height="50" rx="8" fill="#ffffff" stroke="#d0d7de"/><text x="365" y="341" font-weight="700" fill="#1f2328">파일</text><text x="365" y="360" font-size="11.5" fill="#59636e">계약서.pdf …</text>
  </g>
  <g stroke="#59636e" stroke-width="1.6" fill="none" marker-end="url(#b)">
    <path d="M210,255 L288,255"/>
    <path d="M365,280 L365,318"/>
    <path d="M135,230 L135,192"/>
    <path d="M365,230 L365,192"/>
    <path d="M135,280 L135,318"/>
  </g>
  <g font-size="12" fill="#59636e">
    <text x="249" y="247" text-anchor="middle">요구</text>
    <text x="374" y="304">구성</text>
    <text x="144" y="216">상대</text>
    <text x="374" y="216">보관</text>
    <text x="144" y="304">기한</text>
  </g>

  <!-- B. 규칙 검사 -->
  <text x="500" y="108" font-size="15" font-weight="700" fill="#0969da">② 왜 적나 — 세트마다 "있어야 할 서류" 규칙을 건다</text>
  <rect x="500" y="120" width="430" height="270" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M520,138 h18 l5,6 h27 v20 h-50 z" fill="#ddf4ff" stroke="#0969da"/>
  <text x="582" y="157" font-size="14" font-weight="700" fill="#1f2328">외주_디자인_거래처B_2603</text>
  <text x="520" y="184" font-size="12" fill="#59636e">규칙 출처: 제출처 지침의 필수 증빙 표 (추측하지 않음)</text>
  <g font-size="13.5" fill="#1f2328">
    <circle cx="528" cy="211" r="6" fill="#1a7f37"/><text x="544" y="216">계약서</text><text x="910" y="216" text-anchor="end" fill="#1a7f37" font-weight="600">있음</text>
    <circle cx="528" cy="239" r="6" fill="#0969da"/><text x="544" y="244">사업자등록증</text><text x="910" y="244" text-anchor="end" fill="#0969da" font-weight="600">다른 폴더에 있음</text>
    <circle cx="528" cy="267" r="6" fill="#9a6700"/><text x="544" y="272">세금계산서</text><text x="910" y="272" text-anchor="end" fill="#9a6700" font-weight="600">제출 zip 안에만</text>
    <circle cx="528" cy="295" r="6" fill="#9a6700"/><text x="544" y="300">비교견적서 (2부 필요)</text><text x="910" y="300" text-anchor="end" fill="#9a6700" font-weight="600">부족 (1부)</text>
    <circle cx="528" cy="323" r="6" fill="#cf222e"/><text x="544" y="328">결과보고서</text><text x="910" y="328" text-anchor="end" fill="#cf222e" font-weight="600">없음</text>
  </g>
  <rect x="520" y="344" width="390" height="32" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="715" y="365" font-size="13" text-anchor="middle" fill="#1f2328">경고 3건 → 체크리스트·관제탑 · 고치는 건 승인 후</text>

  <!-- C. 세 층 -->
  <text x="30" y="436" font-size="15" font-weight="700" fill="#0969da">③ 누가 유지하나 — 세 층</text>
  <g>
    <rect x="30" y="452" width="600" height="52" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="48" y="476" font-size="14" font-weight="700" fill="#1a7f37">파일 — 무엇이 존재하나</text>
    <text x="48" y="495" font-size="12.5" fill="#1f2328">사실. 마스터 폴더. 정리는 사람이 승인하고, 검증은 코드가 한다</text>
    <text x="330" y="524" font-size="12" fill="#59636e" text-anchor="middle">↓ 자동 추출 (바뀐 것만 다시)</text>
    <rect x="30" y="532" width="600" height="52" rx="8" fill="#ddf4ff" stroke="#0969da"/>
    <text x="48" y="556" font-size="14" font-weight="700" fill="#0969da">그래프 — 무엇이 무엇과 엮이나</text>
    <text x="48" y="575" font-size="12.5" fill="#1f2328">기계가 만든다. 손으로 고치지 않는다 (손으로 만든 그래프는 금방 낡는다)</text>
    <text x="330" y="604" font-size="12" fill="#59636e" text-anchor="middle">↓ 골라서</text>
    <rect x="30" y="612" width="600" height="52" rx="8" fill="#fbefff" stroke="#8250df"/>
    <text x="48" y="636" font-size="14" font-weight="700" fill="#8250df">메모 도구 — 상태·기한·판단·근거</text>
    <text x="48" y="655" font-size="12.5" fill="#1f2328">사람이 쓴다. 파일이 담지 못하는 것만, 적게 (노션·옵시디언 등)</text>
  </g>
  <rect x="660" y="452" width="270" height="212" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="680" y="480" font-size="14.5" font-weight="700" fill="#1f2328">시작 순서</text>
  <g font-size="13" fill="#1f2328">
    <text x="680" y="508">1. 마스터부터 고친다</text>
    <text x="696" y="527" fill="#59636e" font-size="12">0바이트 0, 미이관 0</text>
    <text x="680" y="554">2. 진행 중 프로젝트 하나로 시범</text>
    <text x="696" y="573" fill="#59636e" font-size="12">실제로 무엇을 잡는지 본다</text>
    <text x="680" y="600">3. 효과가 있으면 넓힌다</text>
  </g>
  <text x="680" y="632" font-size="11.5" fill="#cf222e">깨진 마스터 위의 온톨로지는</text>
  <text x="680" y="650" font-size="11.5" fill="#cf222e">깨진 파일을 가리키는 예쁜 그림일 뿐</text>
</svg>
